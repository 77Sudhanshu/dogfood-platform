services:
  postgres:
    image: postgres:17-alpine
    container_name: dogfood-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood_dev_password
      POSTGRES_DB: dogfood

    ports:
      - "5432:5432"

    volumes:
      - dogfood_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: dogfood-app
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://dogfood:dogfood_dev_password@postgres:5432/dogfood"
      AUTH_SECRET: "dogfood_local_dev_secret_change_me"

    ports:
      - "3000:3000"

    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts && npm run start"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dogfood_postgres_data: